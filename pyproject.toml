[project]
name = "ai-review"
version = "0.1.0"
description = "Automated GitHub Pull Request review system with multi-level analysis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Web Framework
    "sanic>=23.12.0",
    "sanic-ext>=23.12.0",

    # Anthropic SDK
    "anthropic>=0.40.0",

    # MongoDB
    "motor>=3.3.0",
    "pymongo>=4.6.0",

    # GitHub API (backup for gh CLI)
    "PyGithub>=2.1.0",

    # Environment & Configuration
    "python-dotenv>=1.0.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",

    # HTTP Client
    "httpx>=0.26.0",

    # Utilities
    "python-dateutil>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.1.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.1.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]